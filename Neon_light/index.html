<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Light</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center; /* horizontal center */
            align-items: center;    /* vertical center */
        }


        .glow {
            color: #fff;
            background: #111;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-family: sans-serif;
            text-shadow: 0 0 8px #c6f105, 0 0 20px #bfe806;
        }
    </style>
</head>

<body>
    <h2 class="glow">Full_stack</h2>

</body>

</html>
